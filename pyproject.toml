[project]
name = "vibe-check"
version = "0.1.0"
description = "Personal work-log assistant: OCS-driven Slack interviews, structured logs, monthly timesheets."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helpers", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913"]  # too-many-arguments — Pydantic models legitimately have many fields

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]  # magic-value-comparison is fine in tests
# OCS Code-node snippets aren't a normal package: they run in a RestrictedPython sandbox as a
# single `main` (no module-level helpers, injected globals like http/datetime, pasted into the
# OCS UI). So statement/branch/complexity caps, line length, magic values, the datetime.UTC
# alias (timezone.utc is the sandbox-safe form), and undefined-name (injected globals) don't fit.
"ocs/snippets/**/*.py" = ["E501", "F821", "UP017", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "C901"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
